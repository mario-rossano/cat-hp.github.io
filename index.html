<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Il Cammino Segreto</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
      :root {
        --paper: #e8d7b4;
        --ink: #493522;
        --dark: #302419;
        --gold: #ad8549;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Georgia, serif;
      }

      header {
        text-align: center;
        padding: 20px 10px 12px;
        background: var(--dark);
        color: var(--paper);
        border-bottom: 4px solid var(--gold);
      }

      header h1 {
        font-size: 24px;
        letter-spacing: 3px;
        margin: 0 0 6px;
      }

      header p {
        font-style: italic;
        font-size: 13px;
        margin: 0;
      }

      #map {
        height: 56vh;
        min-height: 320px;
        border-bottom: 5px solid var(--gold);
        background: #d8c49d;
      }

      .panel {
        max-width: 650px;
        margin: auto;
        padding: 18px;
      }

      .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        text-align: center;
      }

      .stat {
        background: #d7c29b;
        border: 1px solid #a88a5c;
        padding: 14px 5px;
      }

      .stat small {
        display: block;
        font-size: 11px;
        letter-spacing: 1px;
        margin-bottom: 6px;
      }

      .stat strong {
        font-size: 23px;
      }

      .status {
        text-align: center;
        margin: 17px 0;
        font-style: italic;
        min-height: 20px;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }

      button {
        padding: 14px 8px;
        border: 1px solid #8e7045;
        background: var(--dark);
        color: var(--paper);
        font-family: Georgia, serif;
        font-size: 13px;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      button.secondary {
        background: #b99b6d;
        color: #302419;
      }

      .note {
        font-size: 12px;
        line-height: 1.6;
        text-align: center;
        margin-top: 17px;
      }

      .footprint {
        width: 25px;
        height: 38px;
        display: block;
        transform-origin: center;
      }

      .footprint svg {
        width: 100%;
        height: 100%;
        fill: #67442b;
        filter: drop-shadow(1px 2px 1px #aa916d);
      }

      @media (max-width: 400px) {
        #map {
          height: 53vh;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>IL CAMMINO SEGRETO</h1>
      <p>Ogni passo lascia una traccia...</p>
    </header>

    <div id="map"></div>

    <main class="panel">
      <div class="stats">
        <div class="stat">
          <small>DISTANZA PERCORSA</small>
          <strong id="distance">0 m</strong>
        </div>
        <div class="stat">
          <small>IMPRONTE LASCIATE</small>
          <strong id="count">0</strong>
        </div>
      </div>

      <div class="status" id="status">
        Il cammino attende di essere iniziato.
      </div>

      <div class="controls">
        <button id="start">INIZIA IL PERCORSO</button>
        <button id="pause" class="secondary" disabled>METTI IN PAUSA</button>
        <button id="finish" class="secondary" disabled>TERMINA</button>
        <button id="export" class="secondary">ESPORTA TRACCIA</button>
      </div>

      <p class="note">
        Concedi l'accesso alla posizione GPS per lasciare le tue impronte sulla
        mappa. Mantieni la pagina aperta durante il percorso.
      </p>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
      const STORAGE_KEY = "cammino-segreto-v1";
      const STEP_DISTANCE = 3;
      const MAX_ACCURACY = 40;

      let map = L.map("map").setView([41.9, 12.5], 6);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors",
        maxZoom: 19,
      }).addTo(map);

      let watchId = null;
      let running = false;
      let finished = false;
      let lastPosition = null;
      let lastFootPosition = null;
      let totalDistance = 0;
      let footprintCount = 0;
      let nextSide = 0;
      let footprints = [];
      let markers = [];
      let wakeLock = null;

      const $ = (id) => document.getElementById(id);

      function distanceBetween(a, b) {
        const R = 6371000;
        const rad = Math.PI / 180;

        const dLat = (b.lat - a.lat) * rad;
        const dLon = (b.lng - a.lng) * rad;

        const x =
          Math.sin(dLat / 2) ** 2 +
          Math.cos(a.lat * rad) *
            Math.cos(b.lat * rad) *
            Math.sin(dLon / 2) ** 2;

        return 2 * R * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
      }

      function bearing(a, b) {
        const rad = Math.PI / 180;
        const y = Math.sin((b.lng - a.lng) * rad) * Math.cos(b.lat * rad);

        const x =
          Math.cos(a.lat * rad) * Math.sin(b.lat * rad) -
          Math.sin(a.lat * rad) *
            Math.cos(b.lat * rad) *
            Math.cos((b.lng - a.lng) * rad);

        return ((Math.atan2(y, x) * 180) / Math.PI + 360) % 360;
      }

      function offsetPosition(pos, angle, meters) {
        const rad = (angle * Math.PI) / 180;
        const lat = pos.lat + (meters * Math.cos(rad)) / 111320;

        const lng =
          pos.lng +
          (meters * Math.sin(rad)) /
            (111320 * Math.cos((pos.lat * Math.PI) / 180));

        return { lat, lng };
      }

      function footprintIcon(angle, side) {
        const mirror = side === 1 ? -1 : 1;

        return L.divIcon({
          className: "",
          iconSize: [25, 38],
          iconAnchor: [12, 19],
          html: `
      <div class="footprint"
       style="transform:rotate(${angle}deg) scaleX(${mirror})">
        <svg viewBox="0 0 30 48"
         xmlns="http://www.w3.org/2000/svg">
          <path d="
            M15 2
            C20 2 22 8 21 13
            C20 17 18 19 19 23
            C21 29 25 35 23 41
            C22 47 16 48 12 45
            C7 42 7 36 9 30
            C11 24 12 19 9 14
            C6 8 9 2 15 2 Z"/>
          <circle cx="6" cy="5" r="3"/>
          <circle cx="12" cy="2.5" r="3"/>
          <circle cx="19" cy="3" r="3"/>
          <circle cx="25" cy="7" r="2.5"/>
        </svg>
      </div>`,
        });
      }

      function addFootprint(position, direction) {
        const side = nextSide % 2;

        // Piccolo spostamento laterale per separare
        // piede destro e piede sinistro.
        const lateral = direction + 90;
        const adjusted = offsetPosition(
          position,
          lateral,
          side === 0 ? 0.13 : -0.13,
        );

        const marker = L.marker([adjusted.lat, adjusted.lng], {
          icon: footprintIcon(direction, side),
        }).addTo(map);

        markers.push(marker);

        footprints.push({
          lat: adjusted.lat,
          lng: adjusted.lng,
          direction,
          side,
          timestamp: Date.now(),
        });

        nextSide++;
        footprintCount++;

        updateDisplay();
        saveData();
      }

      function updateDisplay() {
        $("distance").textContent =
          totalDistance < 1000
            ? Math.round(totalDistance) + " m"
            : (totalDistance / 1000).toFixed(2) + " km";

        $("count").textContent = footprintCount;
      }

      function saveData() {
        const data = {
          footprints,
          totalDistance,
          footprintCount,
          nextSide,
          lastPosition,
          lastFootPosition,
          finished,
        };

        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      function restoreData() {
        try {
          const data = JSON.parse(localStorage.getItem(STORAGE_KEY));

          if (!data) return;

          footprints = data.footprints || [];
          totalDistance = data.totalDistance || 0;
          footprintCount = data.footprintCount || 0;
          nextSide = data.nextSide || 0;
          lastPosition = data.lastPosition || null;
          lastFootPosition = data.lastFootPosition || null;
          finished = data.finished || false;

          footprints.forEach((fp) => {
            const marker = L.marker([fp.lat, fp.lng], {
              icon: footprintIcon(fp.direction, fp.side),
            }).addTo(map);

            markers.push(marker);
          });

          if (footprints.length) {
            map.setView(
              [
                footprints[footprints.length - 1].lat,
                footprints[footprints.length - 1].lng,
              ],
              17,
            );
          }

          updateDisplay();

          if (finished) {
            $("status").textContent = "Questo cammino è stato completato.";
          }
        } catch (e) {
          console.error("Errore nel recupero dei dati", e);
        }
      }

      function onPosition(position) {
        const p = {
          lat: position.coords.latitude,
          lng: position.coords.longitude,
        };

        if (position.coords.accuracy > MAX_ACCURACY) {
          $("status").textContent =
            "Segnale GPS impreciso. Attendo una posizione migliore...";
          return;
        }

        $("status").textContent = "Il cammino è in corso...";

        if (!lastPosition) {
          lastPosition = p;
          lastFootPosition = p;

          map.setView([p.lat, p.lng], 18);

          addFootprint(p, 0);
          saveData();
          return;
        }

        const distance = distanceBetween(lastPosition, p);

        // Filtro contro oscillazioni GPS.
        if (distance < 1.5) return;

        if (distance > 100) {
          $("status").textContent =
            "Spostamento anomalo rilevato. Verifica il GPS.";
          return;
        }

        const direction = bearing(lastPosition, p);

        totalDistance += distance;

        if (distanceBetween(lastFootPosition, p) >= STEP_DISTANCE) {
          addFootprint(p, direction);
          lastFootPosition = p;
        }

        lastPosition = p;

        updateDisplay();
        saveData();
      }

      function startTracking() {
        if (!navigator.geolocation) {
          $("status").textContent = "Geolocalizzazione non supportata.";
          return;
        }

        if (finished || running) return;

        running = true;

        $("start").disabled = true;
        $("pause").disabled = false;
        $("finish").disabled = false;
        $("status").textContent = "Attendo il segnale GPS...";

        navigator.geolocation.getCurrentPosition(
          onPosition,
          (error) => {
            running = false;
            $("start").disabled = false;
            $("pause").disabled = true;
            $("finish").disabled = true;
            $("status").textContent =
              "Impossibile ottenere la posizione. Controlla i permessi GPS.";
          },
          {
            enableHighAccuracy: true,
            timeout: 20000,
            maximumAge: 0,
          },
        );

        watchId = navigator.geolocation.watchPosition(
          onPosition,
          (error) => {
            $("status").textContent =
              "Segnale GPS interrotto o non disponibile.";
          },
          {
            enableHighAccuracy: true,
            maximumAge: 1000,
            timeout: 20000,
          },
        );

        if ("wakeLock" in navigator) {
          navigator.wakeLock
            .request("screen")
            .then((lock) => {
              wakeLock = lock;
            })
            .catch(() => {});
        }
      }

      function pauseTracking() {
        if (watchId !== null) {
          navigator.geolocation.clearWatch(watchId);
          watchId = null;
        }

        running = false;

        if (wakeLock) {
          wakeLock.release();
          wakeLock = null;
        }

        $("start").disabled = false;
        $("pause").disabled = true;
        $("status").textContent = "Percorso in pausa.";
        saveData();
      }

      function finishTracking() {
        pauseTracking();
        finished = true;

        $("start").disabled = true;
        $("finish").disabled = true;

        $("status").textContent =
          "Il cammino è terminato. La traccia è stata conservata.";

        saveData();
      }

      function exportTrack() {
        const data = {
          title: "Il Cammino Segreto",
          exportedAt: new Date().toISOString(),
          distanceMeters: totalDistance,
          footprints,
        };

        const blob = new Blob([JSON.stringify(data, null, 2)], {
          type: "application/json",
        });

        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");

        a.href = url;
        a.download = "traccia-enigma.json";
        a.click();

        URL.revokeObjectURL(url);
      }

      $("start").addEventListener("click", startTracking);

      $("pause").addEventListener("click", pauseTracking);

      $("finish").addEventListener("click", finishTracking);

      $("export").addEventListener("click", exportTrack);

      restoreData();
    </script>
  </body>
</html>
